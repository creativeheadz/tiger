name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: Syntax and ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python jsonschema, for the schema test
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y -qq python3-jsonschema
      - name: sh -n on every shell script
        run: |
          fail=0; n=0
          for f in $(git ls-files tiger tigris-diff tigris-accept tigexp tigercron config initdefs scripts systems util tests); do
            case "$f" in tests/fixtures/*|*.c|*.pl|*.txt|*.lst|*.tmpl|*.xref|*README*|*/services|*/inetd|*_list|*signatures*|*advisories*|*baseline*|*embedlist*|*facl*) continue;; esac
            [ -f "$f" ] || continue
            head -1 "$f" | grep -q 'perl' && continue
            n=$((n+1))
            sh -n "$f" || { echo "::error file=$f::sh -n failed"; fail=1; }
          done
          echo "$n scripts checked"
          exit $fail
      - name: check_sysctl against known trees
        run: sh tests/sysctl_check.sh
      - name: check_ssh against sshd -T fixtures
        run: sh tests/ssh_check.sh
      - name: check_systemd against ss and systemd-analyze fixtures
        run: sh tests/systemd_check.sh
      - name: JSON Lines report
        run: sh tests/json_check.sh
      - name: tigris-diff between two runs
        run: sh tests/diff_check.sh
      - name: accepted findings
        run: sh tests/accept_check.sh
      - name: Transparent summary
        run: sh tests/summary_check.sh
      - name: Certificates
        run: sh tests/certs_check.sh
      - name: Databases
        run: sh tests/databases_check.sh
      - name: DNS
        run: sh tests/dns_check.sh
      - name: nginx
        run: sh tests/nginx_check.sh
      - name: Remote logging
        run: sh tests/remotelog_check.sh
      - name: JSON schema
        run: sh tests/schema_check.sh
      - name: Every finding id explained
        run: sh tests/explain_check.sh
      - name: Quick profile matches tigerrc
        run: sh tests/profile_check.sh
      - name: A filesystem that does not answer is left alone
        run: sh tests/mounts_check.sh
      - name: Exit status, -q and --since
        run: sh tests/exit_check.sh
      - name: check_listeningprocs against ss, lsof and netstat fixtures
        run: sh tests/listening_check.sh
      - name: deb_statoverride against an override list
        run: sh tests/statoverride_check.sh
      - name: pathmsg adds the level's letter to its ids
        run: sh tests/pathmsg_check.sh
      - name: check_secureboot against /sys trees
        run: sh tests/secureboot_check.sh
      - name: check_mac against /sys trees
        run: sh tests/mac_check.sh
      - name: check_audit against process trees, auditctl and journald drop-ins
        run: sh tests/audit_check.sh
      - name: check_timesync against process trees, timedatectl and chronyc
        run: sh tests/timesync_check.sh
      - name: check_updates against apt, dnf and zypper output and trees
        run: sh tests/updates_check.sh
      - name: check_sudo against cvtsudoers output and sudoers files
        run: sh tests/sudo_check.sh
      - name: check_pam against PAM stacks
        run: sh tests/pam_check.sh
      - name: check_units against enabled units and systemctl cat output
        run: sh tests/units_check.sh
      - name: check_storage against /proc, /sys and /etc trees
        run: sh tests/storage_check.sh
      - name: check_containers against sockets, processes and inspect output
        run: sh tests/containers_check.sh
      - name: check_suid and check_sgid against the package database
        run: sh tests/suid_check.sh
      - name: checks that need root are skipped, and said to be
        run: sh tests/nonroot_check.sh
      - name: tigris --root on an offline root, and util/rootpath
        run: sh tests/offline_check.sh
      - name: the account checks on an offline root, as a user and as root
        run: |
          sh tests/offline_accounts_check.sh
          sudo sh tests/offline_accounts_check.sh
      - name: cron's files and jobs, as a user and as root
        run: |
          sh tests/cron_check.sh
          sudo sh tests/cron_check.sh
      - name: the file system scan of an offline root, as a user and as root
        run: |
          sh tests/offline_scan_check.sh
          sudo sh tests/offline_scan_check.sh
      - name: check_firewall against captured rulesets
        run: sh tests/firewall_check.sh
      - name: ShellCheck (errors)
        run: |
          shellcheck --version | head -2
          files=
          for f in tiger tigexp tigercron config initdefs util/realpath util/rootpath util/summary tests/*.sh \
              $(git ls-files scripts systems/Linux/2 systems/default | grep -v '\.pl$\|README\|\.lst$\|\.tmpl$\|_list$\|signatures\|advisories\|baseline\|embedlist\|facl\|/services$\|/inetd$\|\.sh$'); do
            head -1 "$f" | grep -q perl && continue
            files="$files $f"
          done
          shellcheck -s sh -S error $files

  build:
    name: Build C helpers and docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: ./configure
      - run: make
      - name: Install the helpers into bin/
        run: |
          make -C c install
          ls -l bin/
          test -x bin/realpath && test -x bin/snefru
      - name: Findings reference built from meta/
        run: grep -c '<dt id=' doc/explanations.html
      - name: make install into a staging directory, man pages included
        run: |
          make install DESTDIR="$RUNNER_TEMP/dest"
          for m in tiger tigexp tigercron tigris tigris-diff tigris-accept; do
            test -f "$RUNNER_TEMP/dest/usr/local/share/man/man8/$m.8" || { echo "no $m.8"; exit 1; }
          done
          head -3 "$RUNNER_TEMP/dest/usr/local/share/man/man8/tigris.8"

  smoke:
    name: Full run on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Python jsonschema, so the smoke run validates its JSON
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y -qq python3-jsonschema
      - run: sudo sh tests/smoke.sh

  awks:
    name: Fixture suites under ${{ matrix.awk }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - awk: mawk
            image: debian:stable
            prep: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq binutils file procps diffutils bsdextrautils sudo python3-jsonschema
          - awk: gawk
            image: archlinux:latest
            prep: pacman -Sy --noconfirm -q inetutils binutils file diffutils procps-ng sudo python-jsonschema
          - awk: busybox awk
            image: alpine:latest
            prep: apk add -q coreutils binutils file diffutils procps sudo py3-jsonschema
    steps:
      - uses: actions/checkout@v4
      - name: Every suite, as root in the container
        run: docker run --rm -v "$PWD:/tiger:ro" ${{ matrix.image }} sh -c '${{ matrix.prep }} >/dev/null 2>&1; sh /tiger/tests/all.sh'

  container:
    name: Container image, auditing a root
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t tigris:ci .
      - name: Audit a Debian root with it, mounted read-only
        run: |
          set -e
          docker create --name root-src debian:stable >/dev/null
          mkdir -p "$RUNNER_TEMP/root" "$RUNNER_TEMP/reports"
          docker export root-src | sudo tar -C "$RUNNER_TEMP/root" -xf -
          docker rm root-src >/dev/null
          set +e
          docker run --rm -v "$RUNNER_TEMP/root:/target:ro" -v "$RUNNER_TEMP/reports:/opt/tigris/log" tigris:ci -q --root /target
          st=$?
          set -e
          echo "exit status $st"
          case $st in 0|3|4|5) ;; *) echo "the audit did not finish"; exit 1 ;; esac
          j=$(sudo sh -c "ls $RUNNER_TEMP/reports/*.jsonl" | head -1)
          sudo cat "$j" > report.jsonl
          grep -q '"type":"run".*"root":"/target"' report.jsonl
          grep -q '"type":"summary"' report.jsonl
          grep '"type":"finding"' report.jsonl | head -20
          # nothing in the report names where the root is on the runner
          ! grep -q "$RUNNER_TEMP" report.jsonl

  package-managers:
    name: Package integrity (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:latest
          - image: rockylinux:9
          - image: alpine:latest
          - image: archlinux:latest
          - image: opensuse/tumbleweed:latest
            # a stripped base image: no awk, no find, no tar
            prep: zypper -q install -y gawk tar findutils
    steps:
      - uses: actions/checkout@v4
      - name: Plant problems and check they are found
        run: docker run --rm -v "$PWD:/tiger:ro" ${{ matrix.image }} sh -c '${{ matrix.prep || 'true' }}; sh /tiger/tests/pkg_checks.sh'

  debian-checks:
    name: Debian checks (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:stable", "debian:sid", "ubuntu:24.04"]
    steps:
      - uses: actions/checkout@v4
      - name: Plant problems and check they are found
        # The tree is checked out on the host and mounted read-only, as in
        # the awk and package-manager jobs: deb_checks.sh needs nothing the
        # base images do not ship, so no Node, git or apt install stands
        # between the checkout and the test.
        run: docker run --rm -v "$PWD:/tiger:ro" ${{ matrix.image }} sh /tiger/tests/deb_checks.sh
